<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="title desc">
  <title id="title">Stellite-6 Hardfacing: Hardness and Oxidation Prediction</title>
  <desc id="desc">A reproducibility-first, small-data machine-learning study of TIG-surfaced ferrous alloys.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1120"/>
      <stop offset="0.55" stop-color="#101c31"/>
      <stop offset="1" stop-color="#16263f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#ffc46b"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dbe7f5"/>
      <stop offset="0.45" stop-color="#8fa6c2"/>
      <stop offset="1" stop-color="#4d6480"/>
    </linearGradient>
    <linearGradient id="layer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9a4f"/>
      <stop offset="1" stop-color="#ffd08a"/>
    </linearGradient>
    <radialGradient id="arcGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7cc4ff" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#3d8ee8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#3d8ee8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#8fb6e1" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <rect width="1280" height="340" fill="url(#bg)"/>
  <rect width="1280" height="340" fill="url(#grid)"/>
  <circle cx="1115" cy="52" r="130" fill="#3d8ee8" fill-opacity="0.10" filter="url(#soft)"/>
  <circle cx="1060" cy="300" r="150" fill="#ff8a3d" fill-opacity="0.07" filter="url(#soft)"/>

  <g transform="translate(80 68)">
    <rect width="42" height="4" rx="2" fill="url(#accent)"/>
    <text x="56" y="5" fill="#9fc3e8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="650" letter-spacing="3.2">MATERIALS INFORMATICS · SMALL-DATA STUDY</text>

    <text x="0" y="82" fill="#f4f8fd" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="52" font-weight="750" letter-spacing="-1.4">Stellite-6 Hardfacing</text>
    <text x="0" y="134" fill="#ffb066" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="50" font-weight="700" letter-spacing="-1.2">Hardness &amp; Oxidation Prediction</text>
    <text x="0" y="174" fill="#b8cbe0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="400">A reproducibility-first ML study of TIG-surfaced EN-8 and mild steel,</text>
    <text x="0" y="199" fill="#b8cbe0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="400">built around source audit, grouped validation, and honest limits.</text>

    <g transform="translate(0 236)" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="600">
      <rect width="112" height="32" rx="16" fill="#ffffff" fill-opacity="0.07" stroke="#9fc3e8" stroke-opacity="0.22"/>
      <text x="56" y="21" fill="#dbe9f8" text-anchor="middle">2 substrates</text>
      <rect x="124" width="102" height="32" rx="16" fill="#ffffff" fill-opacity="0.07" stroke="#9fc3e8" stroke-opacity="0.22"/>
      <text x="175" y="21" fill="#dbe9f8" text-anchor="middle">3 currents</text>
      <rect x="238" width="152" height="32" rx="16" fill="#ffffff" fill-opacity="0.07" stroke="#9fc3e8" stroke-opacity="0.22"/>
      <text x="314" y="21" fill="#dbe9f8" text-anchor="middle">24 audited values</text>
      <rect x="402" width="96" height="32" rx="16" fill="#ffffff" fill-opacity="0.07" stroke="#9fc3e8" stroke-opacity="0.22"/>
      <text x="450" y="21" fill="#dbe9f8" text-anchor="middle">46 tests</text>
    </g>
  </g>

  <g transform="translate(936 176)">
    <circle cx="0" cy="0" r="92" fill="url(#arcGlow)"/>
    <g transform="rotate(-18)">
      <rect x="-92" y="-20" width="184" height="40" rx="5" fill="url(#metal)" opacity="0.96"/>
      <rect x="-92" y="-28" width="184" height="12" rx="4" fill="url(#layer)"/>
      <path d="M -78 -28 L -64 -40 L -50 -28 L -36 -40 L -22 -28 L -8 -40 L 6 -28 L 20 -40 L 34 -28 L 48 -40 L 62 -28 L 76 -40 L 78 -28" fill="none" stroke="#ffd9a8" stroke-width="2.4" stroke-linejoin="round" opacity="0.9"/>
    </g>
    <path d="M -30 -74 Q 0 -118 30 -74" fill="none" stroke="#8fd0ff" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="0" cy="-92" r="6" fill="#d8f0ff"/>
    <circle cx="0" cy="-92" r="16" fill="#8fd0ff" fill-opacity="0.2"/>
    <text x="0" y="74" fill="#9fc3e8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="650" letter-spacing="2.4" text-anchor="middle">TIG SURFACING · 973 K</text>
    <text x="0" y="98" fill="#7f9bb8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" text-anchor="middle">substrate · overlay · oxide</text>
  </g>
</svg>
