name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r requirements.txt

      - name: Add project to PYTHONPATH
        run: echo "PYTHONPATH=$PWD" >> $GITHUB_ENV

      - name: Audit source tables
        run: python -m src.data.audit

      - name: Train hardness model
        run: python -m src.models.train_hardness

      - name: Train oxidation model
        run: python -m src.models.train_oxidation

      - name: Calibrate intervals
        run: python -m src.models.calibration

      - name: Verify reproducibility baseline
        run: python -m src.models.reproducibility

      - name: Run fair model benchmark
        run: python -m src.models.benchmark

      - name: Validate external measurement files
        run: python -m src.models.external_validation

      - name: Lint with ruff
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Run tests
        run: pytest -q
